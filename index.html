.human-create{margin:8px;padding:13px 12px;border:1px solid #45665e;border-radius:10px;background:#202e2d;display:flex;flex-direction:column;gap:9px}
.human-create h3{margin:0;color:var(--beam);font-size:12px;font-weight:600}
.human-create label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;color:var(--txt2)}
.human-create select,.human-create input{box-sizing:border-box;width:142px;max-width:67%;min-width:0;min-height:34px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--txt);font-size:12px}
.human-create p{margin:0;color:var(--txt2);font-size:10px;line-height:1.6}
.human-create .human-error{color:var(--warn)}.human-create .human-error:empty{display:none}
.human-create input[aria-invalid="true"]{border-color:var(--warn)}
.human-create button{width:100%;min-height:34px}

.surface-color-panel h3{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--txt)}
.surface-color-row{display:flex;gap:10px;align-items:center}
.surface-color-picker{flex:none;width:48px;height:38px;padding:3px;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.surface-hex-label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--txt2);font:10px var(--mono)}
.surface-hex{width:0;min-width:0;flex:1;box-sizing:border-box;min-height:38px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--txt);font:12px var(--mono)}
.surface-hex[aria-invalid="true"]{border-color:var(--warn)}
.surface-color-palette{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:12px}
.surface-swatch{min-width:0;height:26px;padding:0;border:1px solid #ffffff24;border-radius:5px;cursor:pointer;position:relative}
.surface-swatch[aria-pressed="true"]{outline:2px solid var(--beam);outline-offset:2px}
.surface-swatch[aria-pressed="true"]::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000,0 0 2px #000}
.surface-color-panel :focus-visible{outline:2px solid var(--beam);outline-offset:3px}
.surface-color-error{font-size:10px;line-height:1.6;color:var(--warn);margin:10px 0 0}
.surface-color-error:empty{display:none}
.surface-color-reset{margin-top:12px;font-size:10px;min-height:30px}
.surface-color-note{font-size:10px;line-height:1.7;color:var(--txt2);margin:10px 0 0}

.projector-placement>.ptitle{padding:0 0 10px;color:var(--beam)}
.placement-pick,.placement-submit{width:100%;white-space:normal}
.placement-pick[aria-pressed="true"]{color:var(--beam);border-color:var(--beam)}
.placement-reference,.placement-preview,.placement-note{font-size:10px;line-height:1.7;color:var(--txt2);margin:10px 0;overflow-wrap:anywhere}
.placement-reference{font-family:var(--mono);color:var(--beam)}
.placement-preview{color:var(--beam);font-variant-numeric:tabular-nums;min-height:34px}
.placement-preview.error{color:var(--warn)}
.placement-field{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--txt2);font-size:11px}
.placement-field>span:first-child{width:76px;flex:none}.placement-field>span:last-child{width:14px;flex:none}
.placement-field input{width:0;flex:1;min-width:0;min-height:34px;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--txt);font:11px var(--mono)}
.placement-field input[aria-invalid="true"]{border-color:var(--warn)}
.placement-opposite{font-size:10px;padding:5px 8px;min-height:28px}
.placement-pick-hint{position:absolute;z-index:18;left:16px;right:16px;bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--beam);border-radius:9px;font-size:11px;line-height:1.6;box-shadow:0 8px 24px #0005}
.placement-pick-hint[hidden]{display:none}.placement-pick-hint .tbtn{flex:none}
.picking-placement canvas{cursor:crosshair}
.placement-label{margin-top:-22px}
@media(max-width:959px){.placement-field input{font-size:16px;min-height:38px}.placement-pick-hint{left:12px;right:12px;bottom:12px}}

#siteLocation{color:var(--beam);font:8px var(--sans);letter-spacing:0;margin-top:2px;line-height:1.25}

float shadowDistance(float depth){ return 0.3*120.0 / max(120.0-depth*(120.0-0.3), 0.3); }
vec3 ramp(float t){
  t = clamp(t,0.0,1.0);

       c4=vec3(.91,.83,.25), c5=vec3(.898,.392,.353);

  if(t<.5)  return mix(c2,c3,(t-.25)/.25);
  if(t<.75) return mix(c3,c4,(t-.5)/.25);
  return mix(c4,c5,(t-.75)/.25);
}
float gridPat(vec2 uv){

  vec2 c = abs(uv-0.5);
  float border = smoothstep(0.47,0.485,max(c.x,c.y)); // 외곽 테두리
  float cross = (1.0-smoothstep(0.0,0.012,min(c.x,c.y)))*0.9; // 센터 크로스

const FLOOR_GLOSS = {value:0.1};   // 바닥 광택 (반사율 기반)
const WALL_GLOSS = {value:0}, WALL_REAR = {value:1}; // 기본 벽 전용
function surfGloss(gain){ return THREE.MathUtils.clamp((gain-1)/1.5, 0, 1); }
/* ---------- 모델별 표면 색상 ---------- */
const DEFAULT_SURFACE_COLOR = '#B9C2D0';
const SURFACE_PALETTE = [
  ['기본 회색', DEFAULT_SURFACE_COLOR], ['흰색', '#FFFFFF'],
  ['차콜', '#343B3F'], ['민트', '#85DEC0'],
  ['파랑', '#5D9CEC'], ['노랑', '#F4C95D'],
  ['코랄', '#ED8B7B'], ['보라', '#B69AE5'],

function normalizeSurfaceColor(value){
  if(typeof value!=='string')return null;
  let hex=value.trim().replace(/^#/,'');
  if(/^[0-9a-f]{3}$/i.test(hex))hex=hex.split('').map(c=>c+c).join('');
  return /^[0-9a-f]{6}$/i.test(hex)?'#'+hex.toUpperCase():null;
}
function surfaceColor(p){return normalizeSurfaceColor(p.surfaceColor)||DEFAULT_SURFACE_COLOR;}
function savedSurfaceColor(value){
  if(value===undefined)return DEFAULT_SURFACE_COLOR;
  const color=normalizeSurfaceColor(value);
  if(!color)throw new Error('모델 색상은 #RRGGBB 형식의 HEX 코드로 지정해 주세요.');
  return color;
}
function applySurfaceColor(o){
  if(o.type!=='surf')return;

  uniforms.uAlbedo.value.set(color);

function setSurfaceColor(o,value){
  const color=normalizeSurfaceColor(value);

  o.params.surfaceColor=color;
  applySurfaceColor(o);

}
function createSurfaceColorControls(o){

    if(!picking)flushHistory();

  });

  section.append(heading,row,palette,error,reset,note);refresh();return section;
}

function makeSurfMat(albedoHex, glossEntry, rearEntry){
  return new THREE.ShaderMaterial({
    vertexShader:SURF_VERT, fragmentShader:SURF_FRAG, side:THREE.DoubleSide,
    uniforms:Object.assign({uAlbedo:{value:new THREE.Color(albedoHex)},
                            uSurfaceTint:{value:new THREE.Color(0xFFFFFF)},
                            uGloss:glossEntry||{value:0},
                            uRear:rearEntry||{value:0}}, shared)
  });
}

function addSurface(kind, name, heightMeters){

             gain:1.0, pmode: screenLike ? 'rear' : 'front', surfaceColor:DEFAULT_SURFACE_COLOR};
  if(isPerson)p.humanHeight=heightMeters??(kind==='woman'?1.6:1.75);

/* 서페이스별 광학(게인·리어) → 셰이더 반영 */
function applySurfOptics(o){
  if(o.type!=='surf' || !o.glossU) return;
  applySurfaceColor(o);
  o.glossU.value = surfGloss(o.params.gain||1);

}
/* 프리미티브 병합 (r128에는 mergeBufferGeometries가 없어 직접 병합) */
function mergeGeos(parts){
  const pos=[], nor=[];
  const m4 = new THREE.Matrix4();
  parts.forEach(pt=>{
    const g = pt.geo.toNonIndexed();
    m4.makeRotationFromEuler(new THREE.Euler(pt.rx||0, pt.ry||0, pt.rz||0));
    m4.setPosition(pt.x||0, pt.y||0, pt.z||0);
    g.applyMatrix4(m4);
    const pa = g.attributes.position.array, na = g.attributes.normal.array;
    for(let i=0;i<pa.length;i++){ pos.push(pa[i]); nor.push(na[i]); }
    g.dispose(); pt.geo.dispose();
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  return out;
}
/* 스케일 피규어 마네킹 — height(m), 어깨/골반 비율 */
function humanGeo(height, shoulder, hip){
  shoulder = shoulder||1; hip = hip||1;
  const u = height/1.75;
  const cyl = (rt,rb,h)=>new THREE.CylinderGeometry(rt,rb,h,10,1);
  const sph = r=>new THREE.SphereGeometry(r,10,8);
  const box = (w,h,d)=>new THREE.BoxGeometry(w,h,d);
  return mergeGeos([
    {geo:sph(0.11*u),                              y:1.64*u},                    // 머리

function surfGeo(p){
  switch(p.kind){
    case 'wall':   return new THREE.PlaneGeometry(p.w, p.h);
    case 'curve': {
      const th = THREE.MathUtils.degToRad(p.angle);
      return new THREE.CylinderGeometry(p.radius,p.radius,p.h, 48,1, true, -th/2, th);
    }
    case 'cyl':    return new THREE.CylinderGeometry(p.radius,p.radius,p.h, 48,1, false);
    case 'man':    return humanGeo(personHeight(p), 1.0, 1.0);
    case 'woman':  return humanGeo(personHeight(p), 0.9, 1.08);
    case 'box':    return new THREE.BoxGeometry(p.w,p.h,p.d);
    case 'facade': {
      const w=p.w, h=p.h, s=new THREE.Shape();
      s.moveTo(-w/2,0); s.lineTo(-w/2,h*0.7); s.lineTo(-w*0.18,h*0.7);
      s.absarc(0,h*0.7,w*0.18,Math.PI,0,true);
      s.lineTo(w/2,h*0.7); s.lineTo(w/2,0); s.lineTo(-w/2,0);
      const g = new THREE.ExtrudeGeometry(s,{depth:0.4,bevelEnabled:false});
      g.translate(0,0,-0.2); return g;
    }
  }
}
/* ---------- 3D 모델 임포트 (.obj) ---------- */
function parseOBJ(text, unitScale){
  const V=[], N=[], pos=[], nor=[];
  const lines = text.split('\n');
  for(let li=0; li<lines.length; li++){
    const l = lines[li].split('#')[0].trim();
    if(/^v\s/.test(l)){
      const t = l.split(/\s+/); V.push([+t[1],+t[2],+t[3]]);
    } else if(/^vn\s/.test(l)){
      const t = l.split(/\s+/); N.push([+t[1],+t[2],+t[3]]);
    } else if(/^f\s/.test(l)){
      const t = l.split(/\s+/).slice(1);
      const idx = t.map(s=>{
        const a = s.split('/');
        const vi = parseInt(a[0]); const ni = a[2]?parseInt(a[2]):0;
        return [vi>0?vi-1:V.length+vi, ni>0?ni-1:(ni<0?N.length+ni:-1)];
      });
      for(let k=1;k<idx.length-1;k++){        // 팬 삼각분할
        [idx[0],idx[k],idx[k+1]].forEach(([vi,ni])=>{
          const v = V[vi]; if(!v) return;
          pos.push(v[0],v[1],v[2]);
          if(ni>=0 && N[ni]) nor.push(N[ni][0],N[ni][1],N[ni][2]);
        });
      }
    }
  }
  if(!pos.length) throw new Error('면(f) 데이터가 없어요');
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  if(nor.length === pos.length) g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
  else g.computeVertexNormals();
  // 단위 적용 (실측 스케일) + 바닥(y=0) 정렬 · XZ 센터링
  const u = unitScale||1;
  if(u!==1) g.scale(u,u,u);
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const cx = (bb.min.x+bb.max.x)/2, cz = (bb.min.z+bb.max.z)/2;
  g.translate(-cx, -bb.min.y, -cz);
  return g;
}

  const uScale = unit==='mm'?0.001 : unit==='cm'?0.01 : 1;

function ledTexture(p, src){
  const cols = Math.min(512,Math.max(2, Math.round(p.w*1000/p.pitch/14))); // 표시용 다운샘플
  const rows = Math.min(512,Math.max(2, Math.round(p.h*1000/p.pitch/14)));
  const c = document.createElement('canvas');
  const ar = Math.max(.01,p.w)/Math.max(.01,p.h);
  c.width=Math.max(8,Math.round(Math.min(512,512*ar))); c.height=Math.max(8,Math.round(Math.min(512,512/ar)));
  const x = c.getContext('2d');
  function draw(){
    const el = src && src.ready ? src.el : null;
    let fw = el ? (el.videoWidth||el.naturalWidth||0) : 0;
    let fh = el ? (el.videoHeight||el.naturalHeight||0) : 0;
    if(el && fw && fh){
      // 크롭 영역 → cover 방식
      const cr = src.crop || {x:0,y:0,w:1,h:1};
      const bx = cr.x*fw, by = cr.y*fh, bw = Math.max(1,cr.w*fw), bh = Math.max(1,cr.h*fh);
      const sAR = bw/bh, dAR = c.width/c.height;
      let cw=bw, ch=bh, sx=bx, sy=by;
      if(sAR > dAR){ cw = bh*dAR; sx = bx + (bw-cw)/2; }
      else { ch = cw/dAR; sy = by + (bh-ch)/2; }
      drawOrientedContent(x,el,sx,sy,cw,ch,0,0,c.width,c.height,src);
    } else {
      const gr = x.createLinearGradient(0,0,c.width,c.height);
      gr.addColorStop(0,'#0FD0E0'); gr.addColorStop(.5,'#3A6BF0'); gr.addColorStop(1,'#B04AE8');
      x.fillStyle = gr; x.fillRect(0,0,c.width,c.height);
    }
    x.fillStyle = 'rgba(0,0,0,0.55)';
    const cw2=c.width/cols, ch2=c.height/rows;
    for(let i=0;i<=cols;i++) x.fillRect(i*cw2-0.5,0,1,c.height);
    for(let j=0;j<=rows;j++) x.fillRect(0,j*ch2-0.5,c.width,1);
  }
  draw();
  const t = new THREE.CanvasTexture(c); t.anisotropy=4;
  t.userData = {redraw:()=>{ draw(); t.needsUpdate = true; }};
  return t;
}

function duplicateObj(o){
  let d = null;
  const saved = JSON.parse(JSON.stringify(o.params));
  if(o.type==='proj'){
    const lib = PROJ_LIB.find(l=>l.name===o.params.model) || PROJ_LIB[PROJ_LIB.length-1];
    d = addProjector(lib);
  } else if(o.type==='surf'){
    d = o.params.kind==='model'
      ? addModelFromText(o.name, o.params.objText||'', o.params.unit)
      : addSurface(o.params.kind, o.name);
  } else {
    d = addLED({name:o.name, pitch:o.params.pitch, nits:o.params.nits});
  }
  if(!d) return;
  Object.assign(d.params, saved);
  d.params.x = (saved.x||0) + 1;   // 겹치지 않게 1m 옆
  d.name = o.name + ' 사본';
  if(o.type==='surf' && o.params.kind!=='model') rebuild(d);
  else if(o.type==='led') rebuildLED(d);
  else sync(d);
  refreshTree(); renderProps();
  return d;
}

function loadMedia(file,onReady){
  const isVideo=file.type.startsWith('video');
  if(!isVideo && !file.type.startsWith('image/')){toast('이미지 또는 영상 파일을 선택해 주세요.');return null;}
  if(file.size>(isVideo?120:30)*1024*1024){toast(isVideo?'영상은 120MB 이하로 줄여 주세요.':'이미지는 30MB 이하로 줄여 주세요.');return null;}
  const c={type:isVideo?'video':'img',el:null,name:file.name,size:file.size,ready:false,ver:++contentVer};
  retainedMedia.add(c);
  const rd=new FileReader();c.reader=rd;
  rd.onerror=()=>{if(!c.disposed){c.failed=true;toast('파일을 읽을 수 없어요: '+file.name);}};
  rd.onload=()=>{
    if(c.disposed)return;
    const el=isVideo?document.createElement('video'):new Image();c.el=el;
    const ready=()=>{
      if(c.disposed){destroyMedia(c);return;}
      c.ready=true;
      if(isVideo){attachFrameSync(c);if(activeMediaSet().has(c))el.play().catch(()=>{});else c._resumeWhenActive=true;}
      if(activeMediaSet().has(c))onReady(c);
    };
    if(isVideo){el.loop=true;el.muted=true;el.playsInline=true;el.onloadeddata=ready;}
    else el.onload=ready;
    el.onerror=()=>{if(!c.disposed){c.failed=true;toast(isVideo?'영상을 재생할 수 없어요. MP4(H.264) 또는 WebM을 사용해 주세요.':'이미지를 읽을 수 없어요. JPG/PNG로 변환해 주세요.');}};
    el.src=rd.result;
  };
  rd.readAsDataURL(file);return c;
}
/* 프레임 동기화: 새 비디오 프레임 도착 시점에만 타일을 갱신 (저더 제거) */
function attachFrameSync(c){
  c.frameReady = true;
  if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
    c.hasRVFC = true;
    const cb = ()=>{
      c.frameReady = true;
      if(c.el && !c.disposed) c.el.requestVideoFrameCallback(cb);
    };
    c.el.requestVideoFrameCallback(cb);
  }
}

const BRIDGE_ORIGIN = 'http://127.0.0.1:18765';
const BRIDGE_SIZES = [[1280,720],[1920,1080],[1920,1200]];
const BRIDGE_MIN_VERSION = '1.0.0-beta.4';
const bridgeSettings = {token:'',sources:[],server:null,loading:false,error:'',message:'',revision:0};
const bridgePendingRequests = new Set();
const bridgeConnections = new Set();

function bridgeView(o){

}
function bridgeText(value,limit=180){return typeof value==='string'?value.replace(/[\u0000-\u001f\u007f]/g,' ').slice(0,limit):'';}
function bridgeVersionAtLeast(version,minimum=BRIDGE_MIN_VERSION){
  const parts=value=>{const m=/^v?(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/.exec(String(value||''));return m?[+m[1],+m[2],+m[3],m[4]===undefined?Infinity:+m[4]]:null;};
  const current=parts(version),required=parts(minimum);if(!current||!required)return false;
  for(let i=0;i<4;i++){if(current[i]>required[i])return true;if(current[i]<required[i])return false;}return true;
}
function bridgeServerInfo(data){
  const version=bridgeText(data?.version,50)||'버전 미확인';
  const upgrade='이전 Projector Bridge 앱을 종료한 뒤 '+BRIDGE_MIN_VERSION+' 이상 앱을 실행하고 새 연결 키로 다시 연결해 주세요.';
  if(!bridgeVersionAtLeast(version))throw new Error('실행 중인 연결 프로그램은 '+version+'입니다. '+upgrade);
  const cap=data?.capabilities;
  if(!cap||cap.apiVersion!==1||cap.orientationControls!==true||!Number.isInteger(cap.maxWidth)||!Number.isInteger(cap.maxHeight))
    throw new Error('연결 프로그램 '+version+'의 기능 정보를 확인할 수 없어요. '+upgrade);
  const sizes=BRIDGE_SIZES.filter(([w,h])=>w<=cap.maxWidth&&h<=cap.maxHeight&&(!Array.isArray(cap.sizes)||cap.sizes.some(s=>Array.isArray(s)&&s[0]===w&&s[1]===h)));
  if(!sizes.length)throw new Error('연결 프로그램이 지원하는 수신 크기가 맞지 않아요. '+upgrade);
  return {version,maxWidth:cap.maxWidth,maxHeight:cap.maxHeight,sizes,
    simulatorRevision:bridgeText(cap.simulatorRevision||data.simulatorRevision,50),nativeOrientationCorrection:cap.nativeOrientationCorrection===true};
}
function bridgeAvailableSizes(){return bridgeSettings.server?.sizes||BRIDGE_SIZES;}
function bridgeIsMadMapperSyphon(source){
  return String(source?.protocol||'').toLowerCase()==='syphon'&&/(?:^|[^a-z0-9])mad[\s_-]*mapper(?:[^a-z]|$)/i.test(source.application||source.name||'');

function bridgeSameSource(content,source){return !!content?.bridge&&content.bridgeSource?.id===source?.id&&String(content.bridgeSource?.protocol||'').toLowerCase()===String(source?.protocol||'').toLowerCase();}
function bridgeError(error){
  if(error?.name==='AbortError')return '연결을 취소했어요.';
  if(error?.name==='TypeError')return '연결 프로그램이 실행 중인지 확인하고, 브라우저의 로컬 네트워크 연결 요청을 허용해 주세요. 계속 안 되면 Chrome 또는 Edge에서 다시 열어주세요.';
  return bridgeText(error?.message||'연결하지 못했어요. 연결 프로그램을 확인해 주세요.',260);

async function bridgeFetch(path,{method='GET',body,token=bridgeSettings.token,signal,timeout=18000,keepalive=false}={}){
  const controller=new AbortController();
  const abort=()=>controller.abort();
  if(signal?.aborted)controller.abort();else signal?.addEventListener('abort',abort,{once:true});
  let timedOut=false;
  const timer=setTimeout(()=>{timedOut=true;controller.abort();},timeout);
  try{
    const response=await fetch(BRIDGE_ORIGIN+path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},
      body:body?JSON.stringify(body):undefined,signal:controller.signal,credentials:'omit',cache:'no-store',keepalive});
    if(!response.ok){
      if(response.status===401)throw new Error('연결 키가 맞지 않아요. 연결 프로그램에서 현재 키를 다시 복사해 주세요.');
      if(response.status===403)throw new Error('이 사이트의 연결이 허용되지 않았어요. 연결 프로그램의 허용 사이트 설정을 확인해 주세요.');
      const data=await response.json().catch(()=>({}));
      throw new Error(bridgeText(data.error||data.message,240)||'연결 프로그램 응답 오류 ('+response.status+')');
    }
    return response.status===204?null:await response.json();
  }catch(error){
    if(timedOut)throw new Error('연결 프로그램의 응답이 늦어요. 프로그램 상태를 확인한 뒤 다시 연결해 주세요.');
    throw error;
  }finally{clearTimeout(timer);signal?.removeEventListener('abort',abort);}
}
function bridgeSources(data){
  if(!data || !Array.isArray(data.sources))throw new Error('연결 프로그램의 출력 목록을 읽을 수 없어요. 프로그램 버전을 확인해 주세요.');
  return data.sources.slice(0,256).filter(s=>s&&typeof s.id==='string'&&s.id.length>0&&s.id.length<=1024)
    .map(s=>({id:s.id,name:bridgeText(s.name)||'이름 없는 출력',application:bridgeText(s.application,100),

async function startLiveCapture(o, isLED){
  cancelPendingBridge(o);
  const captureRequest=(o._captureRequest||0)+1;o._captureRequest=captureRequest;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    toast('이 환경에서는 화면 캡처가 지원되지 않아요. GitHub Pages 링크를 Chrome/Edge에서 열어주세요.');
    return;
  }
  let stream;
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video:{ frameRate:{max: stage.capFps||30} }, audio:false
    });
  }catch(err){
    if(err && err.name==='NotAllowedError')
      toast('캡처가 취소됐거나 이 환경에서 차단됐어요. GitHub Pages 링크에서 다시 시도해 주세요.');
    else toast('캡처 시작 실패: ' + (err && err.message || err));
    return;
  }
  if(!objects.includes(o) || o._captureRequest!==captureRequest){stream.getTracks().forEach(t=>t.stop());return;}
  flushHistory();
  const v = document.createElement('video');
  v.srcObject = stream; v.muted = true; v.playsInline = true;
  const c = {type:'video', el:v, name:'라이브 캡처', ready:false, ver:++contentVer,
             live:true, stream, crop:{x:0, y:0, w:1, h:1}};
  retainedMedia.add(c);
  v.onloadeddata = ()=>{
    if(c.disposed || c.ended || !activeMediaSet().has(c))return;
    c.ready = true;
    attachFrameSync(c);
    v.play().catch(()=>{});
    if(isLED) rebuildLED(o);
    renderProps();
  };
  const track = stream.getVideoTracks()[0];
  if(track) track.onended = ()=>{           // 사용자가 공유 중지 / 창 닫힘
    c.ready = false; c.ended = true;
    toast('라이브 캡처가 끊어졌어요. CONTENT에서 재연결할 수 있어요.');
    renderProps();
  };
  if(isLED){ stopMedia(o.ledSrc); o.ledSrc = c; }
  else { stopMedia(o.content); o.content = c; }
  renderProps();commitHistory();
}

/* ---------- 프로젝터 프러스텀 & 카메라 갱신 ---------- */
// One shared rule for renderer, overlap calculations and status indicators.
function activeProjectors(){
  return objects.filter(o=>o.type==='proj' && o.visible && o.params.on).slice(0,MAXP);
}
function projectorStatus(o){
  if(!o.visible) return {active:false, reason:'숨김'};
  if(!o.params.on) return {active:false, reason:'출력 꺼짐'};
  if(!activeProjectors().includes(o)) return {active:false, reason:`동시 투사 ${MAXP}대 초과`};
  return {active:true, reason:'투사 중'};
}
function updateProjector(o){
  const p = o.params;
  const sig = [p.model,p.lensId,p.mount,p.x,p.y,p.z,p.pitch,p.yaw,p.tr,p.resW,p.resH,p.shiftH||0,p.shiftV||0].join('|');
  if(o._projectionSig === sig) return;
  o._projectionSig = sig;
  o.mesh.position.set(p.x,p.y,p.z);
  o.mesh.rotation.set(THREE.MathUtils.degToRad(p.pitch), THREE.MathUtils.degToRad(p.yaw), 0, 'YXZ');
  o.mesh.updateMatrixWorld(true);
  const tanH = 1/(2*p.tr), tanV = tanH*(p.resH/p.resW);
  const optical=opticalShift(p), sH=optical.h, sV=optical.v;
  const shapeSig = [tanH,tanV,sH,sV].join('|');
  if(o._frustumSig !== shapeSig){
    o._frustumSig = shapeSig;
    const far=40, hf=far*tanH, vf=far*tanV, ox=sH*2*hf, oy=sV*2*vf;
    const corners=[[-hf+ox,vf+oy,-far],[hf+ox,vf+oy,-far],[hf+ox,-vf+oy,-far],[-hf+ox,-vf+oy,-far]];
    let attr=o.frust.geometry.getAttribute('position');
    if(!attr){ attr=new THREE.Float32BufferAttribute(new Float32Array(48),3); o.frust.geometry.setAttribute('position',attr); }
    let k=0;
    const point=(a)=>{attr.array[k++]=a[0];attr.array[k++]=a[1];attr.array[k++]=a[2];};
    corners.forEach(c=>{point([0,0,0]);point(c);});
    for(let i=0;i<4;i++){point(corners[i]);point(corners[(i+1)%4]);}
    attr.needsUpdate=true; o.frust.geometry.computeBoundingSphere();
  }
  const near=0.3, hH=near*tanH, hV=near*tanV, offH=sH*2*hH, offV=sV*2*hV;
  o.cam.near=near; o.cam.far=120;
  o.cam.position.copy(o.mesh.position); o.cam.rotation.copy(o.mesh.rotation);
  o.cam.projectionMatrix.makePerspective(-hH+offH,hH+offH,hV+offV,-hV+offV,near,120);
  o.cam.projectionMatrixInverse.copy(o.cam.projectionMatrix).invert();
  o.cam.updateMatrixWorld(true);
  o._tanH=tanH; o._tanV=tanV; o._sH=sH; o._sV=sV;
  if(!o._forward){o._forward=new THREE.Vector3();o._right=new THREE.Vector3();o._up=new THREE.Vector3();}
  o._forward.set(0,0,-1).applyEuler(o.mesh.rotation);
  o._right.set(1,0,0).applyEuler(o.mesh.rotation);
  o._up.set(0,1,0).applyEuler(o.mesh.rotation);
}
function pushUniforms(){
  const act = activeProjectors();
  shared.uNum.value = act.length;
  act.forEach((o,i)=>{
    updateProjector(o);
    shared.uVP.value[i].multiplyMatrices(o.cam.projectionMatrix, o.cam.matrixWorldInverse);
    shared.uPos.value[i].copy(o.cam.position);
    shared.uDir.value[i].copy(o._forward);
    shared.uRight.value[i].copy(o._right);
    shared.uUp.value[i].copy(o._up);
    shared.uCol.value[i].setHex(o.color);
    shared.uLum.value[i] = effLumens(o);
    shared.uTanH.value[i] = o._tanH;
    shared.uTanV.value[i] = o._tanV;
    // 콘텐츠: 활성 인덱스 i의 타일에 그리기 (변경 시 / 영상 재생 중)
    const c = o.content;
    if(c && c.ready){
      const ar = o.params.resW / o.params.resH;
      const key = o.id + ':' + c.ver + ':' + ar;
      if(c.type === 'video'){
        const fresh = tileOwner[i] !== key;
        // rVFC: 새 프레임 도착 시에만 드로우 (저더 없음) / 미지원 브라우저는 격프레임 폴백
        const wantDraw = c.hasRVFC ? c.frameReady
                                   : (!c.live || frame % 2 === 0);
        if(fresh || (!c.el.paused && wantDraw)){
          if(drawContentTile(i, c.el, ar, c.crop, c)){ tileOwner[i] = key; c.frameReady = false; }
        }
      } else if(tileOwner[i] !== key){
        if(drawContentTile(i, c.el, ar, c.crop, c)) tileOwner[i] = key;
      }
      shared.uHasC.value[i] = tileOwner[i] === key ? 1 : 0;
    } else {
      shared.uHasC.value[i] = 0;
    }
  });
  // 그림자 베이크: 씬 변화 또는 활성 프로젝터 구성 변경 시에만
  if(shared.uShadowOn.value > 0.5){
    const sig = act.map(o=>o.id).join(',');
    if(shadowDirty || sig !== shadowSig){
      renderShadows(act);
      shadowDirty = false; shadowSig = sig;
    }
  }
}

/* ---------- 중심선 레이캐스트 (투사거리·이미지 사이즈) ---------- */
const ray = new THREE.Raycaster();
ray.layers.enableAll();  // 레이어1(기즈모·프로젝터 본체)도 클릭·픽킹 대상에 포함
// Nominal illuminance: an axial-distance footprint, cosine incidence and fixed rear loss.
function projectionLux(lumens, axialDistance, tanH, tanV, signedCosine, rearEnabled){
  const transmission = signedCosine < 0 ? (rearEnabled ? 0.75 : 0) : 1;
  const cosI = Math.abs(signedCosine);
  const area = 4*axialDistance*axialDistance*tanH*tanV;
  const lux = axialDistance>0 && area>0 ? lumens/area*cosI*transmission : 0;
  return {lux, cosI, transmission};
}
function projectionTargets(){
  const meshes=objects.filter(x=>x.visible && (x.type==='surf'||x.type==='led')).map(x=>x.mesh);
  if(sysWall && sysWall.visible) meshes.push(sysWall);
  if(sysFloor && sysFloor.visible) meshes.push(sysFloor);
  meshes.forEach(m=>m.updateMatrixWorld(true));
  return meshes;
}
function projectorRay(o,u=0.5,v=0.5){
  updateProjector(o);
  const dir=new THREE.Vector3((2*u-1+2*o._sH)*o._tanH,(2*v-1+2*o._sV)*o._tanV,-1)
    .normalize().applyEuler(o.mesh.rotation);
  return new THREE.Ray(o.mesh.position.clone(),dir);
}
function centerHit(o){
  const pr=projectorRay(o);
  const axialScale=pr.direction.dot(o._forward);
  const cast=new THREE.Raycaster(pr.origin,pr.direction,0.3/axialScale,120/axialScale);
  const hits=cast.intersectObjects(projectionTargets(),false);
  if(!hits.length) return null;
  const target=hits[0], tgtMesh=target.object;
  const targetObj=objects.find(x=>x.mesh===tgtMesh);
  // An LED can occlude the beam, but is not a projection screen in this model.
  if(targetObj && targetObj.type==='led') return null;
  const d=new THREE.Vector3().subVectors(target.point,pr.origin).dot(o._forward);
  if(d<0.3 || d>120) return null;
  const w=d/o.params.tr, h=w*o.params.resH/o.params.resW;
  const normal=target.face.normal.clone().transformDirection(tgtMesh.matrixWorld);
  const rear=tgtMesh===sysWall ? stage.wallMode==='rear' : !!(targetObj && targetObj.params.pmode==='rear');
  const photometry=projectionLux(projectorStatus(o).active?effLumens(o):0,d,o._tanH,o._tanV,-normal.dot(pr.direction),rear);
  let g=tgtMesh===sysWall ? stage.wallGain : tgtMesh===sysFloor ? stage.floorRefl/100 : (targetObj?.params.gain??1);
  const lux=photometry.lux, nits=lux*g/Math.PI, fl=nits/3.426, amb=ambientLux();
  const contrast=amb>0 ? (lux+amb)/amb : (lux>0 ? Infinity : 1);
  return {d,w,h,lux,nits,fl,contrast,gain:g,ppm:o.params.resW/w,pt:target.point.clone(),
    mesh:tgtMesh,normal,nominal:true,transmission:photometry.transmission};
}

/* ---------- 기준점으로 프로젝터 배치 ---------- */
let placementPicking=null, placementVisual=null;
function placementReference(p){

}
function normalizePlacement(p){
  const keys=['placementX','placementY','placementZ','placementDistance','placementHeight','placementBearing','placementAim'];
  if(keys.every(key=>p[key]===undefined))return {};
  if(!placementReference(p))throw new Error('배치 기준점의 X·Y·Z 좌표가 잘못됐어요.');
  return {
    placementX:sceneNumber(p.placementX,0,-60,60,'기준점 X'),
    placementY:sceneNumber(p.placementY,0,0,40,'기준점 Y'),
    placementZ:sceneNumber(p.placementZ,0,-60,60,'기준점 Z'),
    placementDistance:sceneNumber(p.placementDistance,5,0,120,'배치 수평거리'),
    placementHeight:sceneNumber(p.placementHeight,p.y??2,0,40,'배치 렌즈 높이'),
    placementBearing:sceneNumber(p.placementBearing,0,-180,180,'배치 방향'),
    placementAim:sceneBool(p.placementAim,true,'기준점 바라보기'),

function calculateProjectorPlacement(p,settings){
  const point=placementReference(p);
  if(!point)throw new Error('먼저 벽·바닥·모델에서 기준점을 선택해 주세요.');
  const {distance,height,bearing,aim}=settings;
  for(const [value,min,max,label,factor,unit] of [[distance,0,120,'수평거리',1000,'mm'],[height,0,40,'렌즈 높이',1000,'mm'],[bearing,-180,180,'배치 방향',1,'°']]){
    if(!Number.isFinite(value)||value<min||value>max)throw new Error(label+'는 '+(min*factor).toLocaleString('ko-KR')+'–'+(max*factor).toLocaleString('ko-KR')+' '+unit+' 사이로 입력해 주세요.');
  }
  if(typeof aim!=='boolean')throw new Error('기준점 바라보기 설정을 확인해 주세요.');
  const angle=bearing*Math.PI/180;
  const result={x:point.x+Math.sin(angle)*distance,y:height,z:point.z+Math.cos(angle)*distance};
  if(Math.abs(result.x)>60+1e-9||Math.abs(result.z)>60+1e-9)throw new Error('배치 위치가 작업 범위(X·Z ±60,000 mm)를 벗어납니다. 거리나 방향을 바꿔 주세요.');
  // Round numerical noise only; do not clamp a meaningful placement distance.
  result.x=Number(result.x.toFixed(10));result.z=Number(result.z.toFixed(10));
  if(Math.hypot(result.x-point.x,result.y-point.y,result.z-point.z)<0.000001)
    throw new Error('기준점과 프로젝터가 같은 위치입니다. 거리 또는 높이를 바꿔 주세요.');
  if(aim){
    const dx=point.x-result.x,dy=point.y-result.y,dz=point.z-result.z;
    result.yaw=Math.hypot(dx,dz)<0.000001?(p.yaw??bearing):Math.atan2(-dx,-dz)*180/Math.PI;
    result.pitch=Math.atan2(dy,Math.hypot(dx,dz))*180/Math.PI;
  }

}
function placementBearing(point,normal,projector,cameraPoint){
  let dx=normal?.x||0,dz=normal?.z||0;
  if(Math.hypot(dx,dz)>0.001){
    const toward=(cameraPoint.x-point.x)*dx+(cameraPoint.y-point.y)*(normal.y||0)+(cameraPoint.z-point.z)*dz;
    if(toward<0){dx=-dx;dz=-dz;}
  }else{
    dx=projector.x-point.x;dz=projector.z-point.z;
    if(Math.hypot(dx,dz)<0.001){dx=cameraPoint.x-point.x;dz=cameraPoint.z-point.z;}
    if(Math.hypot(dx,dz)<0.001){dx=0;dz=1;}
  }
  return Number((Math.atan2(dx,dz)*180/Math.PI).toFixed(2));

function setProjectorReference(o,point,bearing){
  if(o.type!=='proj'||!objects.includes(o))throw new Error('배치할 프로젝터를 먼저 선택해 주세요.');
  if(![point.x,point.y,point.z,bearing].every(Number.isFinite)||Math.abs(point.x)>60||Math.abs(point.z)>60||point.y<0||point.y>40||Math.abs(bearing)>180)
    throw new Error('기준점은 X·Z ±60,000 mm, 높이 0–40,000 mm 안에서 선택해 주세요.');

  Object.assign(o.params,{placementX:point.x,placementY:point.y,placementZ:point.z,
    placementDistance:o.params.placementDistance??5,placementHeight:o.params.placementHeight??o.params.y,
    placementBearing:bearing,placementAim:o.params.placementAim??true});

function applyProjectorPlacement(o,settings){
  if(o.type!=='proj'||!objects.includes(o)||selected!==o)throw new Error('배치할 프로젝터를 다시 선택해 주세요.');

}

function sync(o){
  markShadowDirty();
  if(o.type==='proj'){ updateProjector(o); }
  else { o.mesh.position.set(o.params.x,o.params.y,o.params.z);
         if(o.params.ry!==undefined) o.mesh.rotation.y = THREE.MathUtils.degToRad(o.params.ry);
         if(o.params.kind==='model') o.mesh.scale.setScalar(o.params.scale||1);
         applySurfOptics(o); }
}
function rebuild(o){
  markShadowDirty();

  o.mesh.geometry = surfGeo(o.params);
  sync(o);
}
function rebuildLED(o){
  markShadowDirty();

  o.mesh.geometry = new THREE.PlaneGeometry(o.params.w,o.params.h);
  const previousMap = o.mesh.material.map;
  o.mesh.material.map = ledTexture(o.params, o.ledSrc);

}

function updateLEDBrightness(o){

function measurementPoint(endpoint){
  if(!endpoint)return null;
  if(endpoint.kind==='projector'){
    const p=endpoint.object?.params;
    return p && objects.includes(endpoint.object)?new THREE.Vector3(p.x,p.y,p.z):null;
  }
  return new THREE.Vector3(...endpoint.point);
}
function measurementMetrics(a,b){
  const p=measurementPoint(a),q=measurementPoint(b);if(!p || !q)return null;
  const dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z;
  return {a:p,b:q,distance:Math.hypot(dx,dy,dz),horizontal:Math.hypot(dx,dz),height:Math.abs(dy),dx,dy,dz};
}
function measurementLength(meters){return measure.unit==='m'?meters.toFixed(3)+' m':Math.round(meters*1000).toLocaleString()+' mm';}
function measurementEndpointLabel(endpoint){
  if(endpoint?.kind==='projector')return endpoint.object.name+' · 렌즈';

}
function snapshotMeasurements(){

}
function restoreMeasurements(data){

    if(o.type==='proj')o.mesh.traverse(mesh=>{if(mesh.isMesh && mesh.visible && mesh.userData.oid===o.id)list.push(mesh);});
    else list.push(o.mesh);

  const hit=hits[0];let target=hit.object,object=null;
  while(target && !object){if(target.userData.oid)object=objects.find(o=>o.id===target.userData.oid);target=target.parent;}
  return object?.type==='proj'?{kind:'projector',object}:{kind:'point',point:[hit.point.x,hit.point.y,hit.point.z]};

/* ---------- 엣지 블렌드: 인접 프로젝터와의 오버랩 계산 ---------- */
function intervalOverlap(a0,a1,b0,b1){ return Math.max(0,Math.min(a1,b1)-Math.max(a0,b0)); }
function blendPlaneSupported(o,hit){
  if(!hit || !hit.mesh || !/Plane/.test(hit.mesh.geometry.type)) return false;
  updateProjector(o);
  return Math.abs(hit.normal.dot(o._forward))>0.9995;
}
function computeBlend(o, hit){
  const active=activeProjectors();
  if(!active.includes(o) || !blendPlaneSupported(o,hit)) return null;
  let best=null;
  active.filter(x=>x!==o).forEach(x=>{
    const h2=centerHit(x);
    if(!blendPlaneSupported(x,h2) || h2.mesh!==hit.mesh || o._right.dot(x._right)<0.9995 || o._up.dot(x._up)<0.9995) return;
    const delta=new THREE.Vector3().subVectors(h2.pt,hit.pt);
    const dx=delta.dot(o._right), dy=delta.dot(o._up);
    const ov=intervalOverlap(-hit.w/2,hit.w/2,dx-h2.w/2,dx+h2.w/2);
    const vertical=intervalOverlap(-hit.h/2,hit.h/2,dy-h2.h/2,dy+h2.h/2);
    if(ov<=0.01 || vertical<=0.01 || ov>=Math.min(hit.w,h2.w)-0.01) return;
    if(!best || ov*vertical>best.area) best={name:x.name,ov,vertical,area:ov*vertical};
  });
  if(!best) return null;
  return {name:best.name,mm:Math.round(best.ov*1000),px:Math.round(best.ov*o.params.resW/hit.w),
    pct:Math.round(best.ov/hit.w*100),vertical:best.vertical};
}

function makeArrow(axis, colorHex){

  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.78,8), mat);

  hit.position.y = 0.575;
  g.add(shaft, tip, hit);
  [shaft,tip,hit,g].forEach(m=>m.userData.axis=axis);
  if(axis==='x') g.rotation.z = -Math.PI/2;
  if(axis==='z') g.rotation.x =  Math.PI/2;

}
const AXIS_DIR = {x:new THREE.Vector3(1,0,0), y:new THREE.Vector3(0,1,0), z:new THREE.Vector3(0,0,1)};

/* 레이–축 최근접 파라미터 (축 위 좌표) */
function axisT(rayO, rayD, lineO, lineD){
  const n = new THREE.Vector3().crossVectors(rayD, lineD);
  const n2 = n.lengthSq();
  // 축이 시선과 거의 평행하면(sin²θ<0.0025, 약 3° 이내) 계산이 폭주하므로 무시
  if(n2 < 0.0025) return null;
  const diff = new THREE.Vector3().subVectors(lineO, rayO); // 부호 수정: 드래그 방향 일치
  return new THREE.Vector3().crossVectors(diff, rayD).dot(n)/n2;
}

const rotPlane = new THREE.Plane();
function ringHitVec(axis, center){
  rotPlane.setFromNormalAndCoplanarPoint(axis, center);
  // 시선이 링 평면과 거의 평행하면 교점이 폭주 → 무시
  if(Math.abs(rotPlane.normal.dot(ray.ray.direction)) < 0.06) return null;
  const q = new THREE.Vector3();

}

let views = [];       // {name, tgt:[x,y,z], r, theta, phi}

function applyView(v){
  camAnim = {
    from:{tgt:orbit.tgt.clone(), r:orbit.r, theta:orbit.theta, phi:orbit.phi},
    to:{tgt:new THREE.Vector3(...v.tgt), r:v.r, theta:v.theta, phi:v.phi},
    t0:performance.now()

function stepCamAnim(){
  if(!camAnim) return;
  const t = Math.min((performance.now()-camAnim.t0)/600, 1);

  orbit.tgt.lerpVectors(camAnim.from.tgt, camAnim.to.tgt, e);
  orbit.r = THREE.MathUtils.lerp(camAnim.from.r, camAnim.to.r, e);
  orbit.theta = THREE.MathUtils.lerp(camAnim.from.theta, camAnim.to.theta, e);

}

function pointerOverCanvas(e){
  const canvas=renderer.domElement,r=canvas.getBoundingClientRect();

      if(fields.length<4) throw new Error('OBJ 면에 꼭짓점이 부족해요.');

function normalizeMeasurementEndpoint(endpoint, sceneObjects, label){

  });

function releaseSceneObject(o){

  });

function destroyMedia(c){
  if(!c || c.disposed) return;

  closeBridgeMedia(c);

  if(c.stream) c.stream.getTracks().forEach(t=>t.stop());
  if(c.el){c.el.onload=null;c.el.onloadeddata=null;c.el.onerror=null;
    if(c.type==='video'){c.el.pause();c.el.srcObject=null;c.el.removeAttribute('src');c.el.load();}
    else c.el.src='';}
}
function activeMediaSet(){return new Set(objects.flatMap(o=>[o.content,o.ledSrc]).filter(Boolean));}
function reconcileMedia(){

      if(c._resumeWhenActive && c.el && c.type==='video' && !c.ended){c._resumeWhenActive=false;c.el.play().catch(()=>{});}
    }else if(c.type==='video' && c.el){
      if(!c.el.paused) c._resumeWhenActive=true;
      c.el.pause();

    }

function collectHistoryResources(){

  retainedObjects.forEach(o=>{if(!keepObjects.has(o)){releaseSceneObject(o);retainedObjects.delete(o);}});

function retainedByteEstimate(){

  historyEntries.forEach(s=>s.objects.forEach(x=>{os.add(x.ref);if(x.content)ms.add(x.content.ref);if(x.ledSrc)ms.add(x.ledSrc.ref);}));
  let bytes=0;ms.forEach(c=>{bytes+=(c.size||0)*1.4;});
  os.forEach(o=>{if(o.mesh)o.mesh.traverse(m=>{if(m.geometry)Object.values(m.geometry.attributes).forEach(a=>bytes+=a.array.byteLength);});});

  historyEntries=historyEntries.slice(0,historyIndex+1); snap.key=key;historyEntries.push(snap);historyIndex=historyEntries.length-1;
  while(historyEntries.length>SCENE_LIMITS.history || (historyEntries.length>1 && retainedByteEstimate()>SCENE_LIMITS.retainedBytes)){

function applySceneData(raw){
  const data=normalizeSceneData(raw); // Validate the complete file before any scene mutation.
  cancelPlacementPick();

  historyApplying=true;objects=[];

    Object.assign(stage,data.stage);views=data.views;shared.uTargetLux.value=data.targetLux;
    data.objects.forEach(so=>{
      let o;
      if(so.type==='proj')o=addProjector(PROJ_LIB.find(l=>l.name===so.params.model)||PROJ_LIB[PROJ_LIB.length-1]);
      else if(so.type==='surf')o=so.params.kind==='model'?addModelFromText(so.name,so.params.objText,so.params.unit):addSurface(so.params.kind,so.name);
      else o=addLED({name:so.name,pitch:so.params.pitch,nits:so.params.nits,w:so.params.w,h:so.params.h});
      if(!o)throw new Error('오브젝트를 만들지 못했어요.');

      if(o.type==='proj'){o.color=so.color;o.frust.material.color.setHex(so.color);sync(o);}
      else if(o.type==='led')rebuildLED(o);else rebuild(o);

  }catch(err){
    objects.forEach(releaseSceneObject);objects=old.objects;Object.assign(stage,old.stage);views=old.views;
    shared.uTargetLux.value=old.targetLux;seq=old.seq;selected=old.selected;
    restoreMeasurements(old.measurements);
    updateStage();syncShadowBtn();renderViews();refreshTree();renderProps();updateLegend();
    throw err;
  }finally{historyApplying=false;}
  old.objects.forEach(o=>{retainedObjects.add(o);scene.remove(o.mesh);});

/* ---------- 탑뷰 리그 도면 (PNG) ---------- */
function exportTopView(){
  try{ exportTopViewInner(); }
  catch(err){ alert('도면 생성 중 오류: '+err.message); console.error(err); }
}
function exportTopViewInner(){
  // 범위 계산: 무대 + 모든 오브젝트
  let minX=-stage.stageW/2, maxX=stage.stageW/2, minZ=-stage.stageD/2, maxZ=stage.stageD/2;
  objects.forEach(o=>{
    const p=o.params, r=Math.max(p.w||2, p.d||2, (p.radius||1)*2, 2)/2;
    minX=Math.min(minX,p.x-r); maxX=Math.max(maxX,p.x+r);
    minZ=Math.min(minZ,p.z-r); maxZ=Math.max(maxZ,p.z+r);
  });
  const pad=2.5; minX-=pad; maxX+=pad; minZ-=pad; maxZ+=pad;
  const W=1600, TH=110; // 타이틀 영역 높이
  const sc=Math.min(W/(maxX-minX), 1400/(maxZ-minZ));
  const H=Math.ceil((maxZ-minZ)*sc)+TH;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const px=(wx)=>(wx-minX)*sc, pz=(wz)=>(wz-minZ)*sc+TH;
  // 배경·타이틀
  x.fillStyle='#14191c'; x.fillRect(0,0,W,H);
  x.fillStyle='#8BE4C5'; x.font='600 22px monospace';
  x.fillText('PROJECTOR SIMULATOR — TOP VIEW (리그 도면)', 24, 38);
  x.fillStyle='#9A9A9A'; x.font='12px monospace';
  x.fillText('by Moon', W-90, 38);
  x.fillStyle='#8B95A7'; x.font='13px monospace';
  const now=new Date();
  x.fillText(`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} · 격자 1칸 = 1 m · 단위 mm · 위쪽 = 무대 안(-Z)`, 24, 62);
  x.fillText(`목표 조도 ${shared.uTargetLux.value} lx · 주변광 ${ambientLux().toFixed(1)} lx`, 24, 84);
  // 1m 격자
  x.strokeStyle='#1F1F1F'; x.lineWidth=1;
  for(let gx=Math.ceil(minX); gx<=maxX; gx++){ x.beginPath(); x.moveTo(px(gx),TH); x.lineTo(px(gx),H); x.stroke(); }
  for(let gz=Math.ceil(minZ); gz<=maxZ; gz++){ x.beginPath(); x.moveTo(0,pz(gz)); x.lineTo(W,pz(gz)); x.stroke(); }
  // 무대 바닥
  if(stage.floorOn){
    x.strokeStyle='#333333'; x.lineWidth=2;
    x.strokeRect(px(-stage.stageW/2), pz(-stage.stageD/2), stage.stageW*sc, stage.stageD*sc);
  }
  // 회전 사각 헬퍼
  function rotRect(cx,cz,w,d,ryDeg,stroke){
    const a=-THREE.MathUtils.degToRad(ryDeg||0), co=Math.cos(a), si=Math.sin(a);
    const pts=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]].map(([u,v])=>[px(cx+u*co-v*si), pz(cz+u*si+v*co)]);
    x.beginPath(); pts.forEach((p2,i)=>i?x.lineTo(p2[0],p2[1]):x.moveTo(p2[0],p2[1])); x.closePath();
    x.strokeStyle=stroke; x.lineWidth=2; x.stroke();
  }
  // 기본 벽
  if(stage.wallOn) rotRect(stage.wallX, stage.wallZ, stage.wallW, 0.15, stage.wallRy, '#B9C2D0');
  // 서페이스·LED
  objects.filter(o=>o.visible && o.type!=='proj').forEach(o=>{
    const p=o.params;
    if(o.type==='led'){ rotRect(p.x,p.z,p.w,0.12,p.ry,'#5AD1DE'); }
    else if(p.kind==='wall'){ rotRect(p.x,p.z,p.w,0.12,p.ry,'#B9C2D0'); }
    else if(p.kind==='cyl'||p.kind==='man'||p.kind==='woman'){
      const r=(p.kind==='cyl'?p.radius:0.25*personHeight(p)/(p.kind==='woman'?1.6:1.75))*sc;
      x.beginPath(); x.arc(px(p.x),pz(p.z),Math.max(r,4),0,Math.PI*2);
      x.strokeStyle='#B9C2D0'; x.lineWidth=2; x.stroke();
    }
    else if(p.kind==='curve'){
      const a0=-THREE.MathUtils.degToRad(p.ry||0);
      const th=THREE.MathUtils.degToRad(p.angle||120);
      x.beginPath();
      x.arc(px(p.x), pz(p.z), p.radius*sc, a0-Math.PI/2-th/2, a0-Math.PI/2+th/2);
      x.strokeStyle='#B9C2D0'; x.lineWidth=2; x.stroke();
    }
    else { rotRect(p.x,p.z,p.w||4,(p.kind==='facade'?0.4:p.d||4),p.ry,'#B9C2D0'); }
    x.fillStyle='#8B95A7'; x.font='11px monospace';
    x.fillText(o.name, px(p.x)+6, pz(p.z)-6);
  });
  // 프로젝터: 위치·방향·빔 부채꼴·치수
  const projs = objects.filter(o=>o.type==='proj' && o.visible);
  projs.forEach((o,i)=>{
    const p=o.params, hit=centerHit(o);
    const col='#'+o.color.toString(16).padStart(6,'0');
    const X0=px(p.x), Z0=pz(p.z);
    const targets=projectionTargets();
    const endpoint=(u)=>{
      const pr=projectorRay(o,u,0.5), axialScale=pr.direction.dot(o._forward);
      const cast=new THREE.Raycaster(pr.origin,pr.direction,0.3/axialScale,120/axialScale);
      const h=cast.intersectObjects(targets,false)[0];
      const depth=hit?hit.d:12;
      return h?h.point:pr.at(depth/Math.max(0.001,pr.direction.dot(o._forward)),new THREE.Vector3());
    };
    const centerEnd=endpoint(0.5), edgeEnds=[endpoint(0),endpoint(1)];
    x.strokeStyle=col; x.lineWidth=1.5; x.setLineDash([]);
    edgeEnds.forEach(q=>{x.beginPath();x.moveTo(X0,Z0);x.lineTo(px(q.x),pz(q.z));x.stroke();});
    x.setLineDash([6,5]);
    x.beginPath();x.moveTo(X0,Z0);x.lineTo(px(centerEnd.x),pz(centerEnd.z));x.stroke();
    x.setLineDash([]);
    x.fillStyle=col;
    x.beginPath(); x.arc(X0,Z0,6,0,Math.PI*2); x.fill();
    x.font='bold 13px monospace'; x.fillStyle=col;
    x.fillText(`P${i+1} ${p.model}`, X0+10, Z0-10);
    x.font='11px monospace'; x.fillStyle='#E6EBF2';
    x.fillText(`(${Math.round(p.x*1000)}, ${Math.round(p.z*1000)}) mm · H ${Math.round(p.y*1000)} mm`, X0+10, Z0+6);
    if(hit){
      const mx=(X0+px(centerEnd.x))/2, mz=(Z0+pz(centerEnd.z))/2;
      x.fillStyle='#8BE4C5';
      x.fillText(`d = ${Math.round(hit.d*1000).toLocaleString()} mm`, mx+8, mz-4);
      x.fillText(`기준면 ${Math.round(hit.w*1000).toLocaleString()} × ${Math.round(hit.h*1000).toLocaleString()} mm (근사)`, X0+10, Z0+22);
    }
  });
  const url = c.toDataURL('image/png');
  // 모달 미리보기에 도면 표시 (다운로드가 막힌 환경에서도 길게 눌러 저장 가능)
  const img = document.getElementById('snapimg');
  if(img) img.src = url;
  downloadDataURL('projector_simulator_topview.png', url);
}

/* ---------- Publish (스냅샷 + 리포트) ---------- */
document.getElementById('btnPublish').onclick = ()=>{
  renderer.render(scene, camera);
  const url = measurementSnapshotURL();
  document.getElementById('snapimg').src = url;
  const lines = [];
  const now = new Date();
  lines.push(`Projector Simulator 리포트 — ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
  lines.push(`목표 조도: ${shared.uTargetLux.value} lux · 주변광 ${ambientLux().toFixed(1)} lux (${AMB_PRESETS[stage.ambPreset].label}) · 광량 유지율 ${stage.derate||100}%`);
  lines.push('계산값은 설치 검토용 근사치입니다. 기준면 크기는 실제 경사·곡면의 투사 윤곽이 아닙니다.');
  lines.push('블렌드 수치는 동일 평면에 수직 투사한 두 화면의 가로·세로 교집합이 있을 때만 표시합니다.');
  lines.push('─'.repeat(46));
  const projs = objects.filter(o=>o.type==='proj');
  if(!projs.length) lines.push('프로젝터 없음');
  projs.forEach((o,i)=>{
    const p = o.params, hit = centerHit(o);
    const lib = PROJ_LIB.find(l=>l.name===p.model);
    const lensName = selectedLens(p).name;
    lines.push(`[P${i+1}] ${p.model}  ${p.on?'ON':'OFF'}${o.visible?'':' · 숨김'}${p.output<100?` · 출력 ${p.output}%`:''}`);
    lines.push(`  ${nominalLumens(p).toLocaleString()} lm (${lightBasis(p)}) · ${p.resW}×${p.resH} · 렌즈 ${lensName} · TR ${p.tr.toFixed(2)}${(p.shiftV||p.shiftH)?` · 시프트 V${p.shiftV||0}% H${p.shiftH||0}%`:''}`);
    lines.push(`  설치 ${p.mount==='ceiling'?'천장':'정방향'} · 사양 ${SPEC_REVISION} · 거리/조도는 공칭 근사값`);
    if(lib?.specUrl)lines.push('  출처 '+lib.specUrl);
    if(p.specReviewNote)lines.push('  보정 '+p.specReviewNote);
    lines.push(`  위치 (${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})`);
    if(hit){
      const ok = hit.lux >= shared.uTargetLux.value;
      lines.push(`  투사거리 ${hit.d.toFixed(2)} m → 기준면 크기 ${hit.w.toFixed(2)} × ${hit.h.toFixed(2)} m (실제 표면의 투사 윤곽과 다를 수 있음)`);
      const nv2 = nitVerdict(hit.nits);
      lines.push(`  중심 조도 ${hit.lux.toFixed(0)} lux ${ok?'✓ 목표 충족':'⚠ 목표 미달'} · 체감 밝기 ${hit.nits.toFixed(0)} nit (${hit.fl.toFixed(1)} fL, 게인 ${hit.gain.toFixed(2)}) — ${nv2.txt.replace('✓ ','')} · 콘트라스트 ${isFinite(hit.contrast)?hit.contrast.toFixed(1)+':1':'∞'} · ${hit.ppm.toFixed(0)} px/m`);
      const bl = computeBlend(o, hit);
      if(bl) lines.push(`  엣지 블렌드: ${bl.name}와 오버랩 ${bl.mm.toLocaleString()} mm · ${bl.px} px (${bl.pct}%)`);
    } else lines.push(`  ⚠ 중심선이 서페이스에 닿지 않음`);
    lines.push('');
  });
  const leds = objects.filter(o=>o.type==='led');
  leds.forEach((o,i)=>{
    const p = o.params;
    const rw = Math.round(p.w*1000/p.pitch), rh = Math.round(p.h*1000/p.pitch);
    lines.push(`[LED${i+1}] ${o.name} — ${p.w}×${p.h} m · P${p.pitch} · ${rw}×${rh} px · ${p.nits.toLocaleString()} nit`);
  });
  const surfs = objects.filter(o=>o.type==='surf');
  if(surfs.length) lines.push(`서페이스 ${surfs.length}개: ` + surfs.map(s=>s.name).join(', '));
  lines.push('');
  if(measure.items.length){lines.push('치수선 · 3D 직선거리');lines.push(...measurementReportLines());lines.push('');}
  lines.push('— Projector Simulator · designed & built by Moon —');
  document.getElementById('report').textContent = lines.join('\n');
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('mPng').onclick = ()=>{
    // 스냅샷 미리보기가 탑뷰로 바뀌었을 수 있으니 원래 스냅샷으로 복원 후 저장
    document.getElementById('snapimg').src = url;
    downloadDataURL('projector_simulator_snapshot.png', url);
  };
};
document.getElementById('mClose').onclick = ()=>document.getElementById('modal').style.display='none';
document.getElementById('mTop').onclick = exportTopView;
document.getElementById('mJson').onclick = ()=>download('projector_simulator_scene.json', serialize(), 'application/json');

/* ---------- HUD ---------- */
const hud = document.getElementById('hud');
function updateHUD(){
  let t = `오브젝트 ${objects.length} · 프로젝터 ${objects.filter(o=>o.type==='proj').length}/${MAXP} · made by Moon`;
  if(selected && selected.type==='proj'){
    const hit = centerHit(selected);
    if(hit) t += `\n${selected.name} → ${hit.d.toFixed(1)}m · ${hit.w.toFixed(1)}×${hit.h.toFixed(1)}m · ${hit.lux.toFixed(0)} lux`;
  }
  hud.textContent = t;
  if(selected && selected.type==='led') updateLEDReadout(selected);
  updateProjectorReadout();
}

/* ---------- 접근성 · 내보내기 ---------- */
function layoutViewportTools(){
  const bar=document.querySelector('.viewport-tools');
  if(bar) camViewsEl.style.top=(bar.offsetTop+bar.offsetHeight+10)+'px';
  const ruler=document.getElementById('rulerPanel');
  if(ruler){const top=camViewsEl.offsetTop+camViewsEl.offsetHeight+10;ruler.style.top=top+'px';ruler.style.maxHeight=Math.max(72,vpEl.clientHeight-top-16)+'px';}
}
if(typeof ResizeObserver!=='undefined') new ResizeObserver(layoutViewportTools).observe(vpEl);
window.addEventListener('resize',layoutViewportTools);
document.getElementById('btnHelp').onclick=()=>toast('드래그: 회전 · 우클릭 / Shift+드래그: 이동 · 휠 / 두 손가락: 확대 · 오브젝트 선택 후 축으로 배치 · ⌘/Ctrl Z: 실행 취소',7000);
document.getElementById('mReport').onclick=()=>download('projector_simulator_report.txt',document.getElementById('report').textContent,'text/plain;charset=utf-8');
const exportModal=document.getElementById('modal');
exportModal.addEventListener('click',e=>{if(e.target===exportModal)closeExport();});
function closeExport(){exportModal.style.display='none';document.getElementById('btnPublish').focus();}
document.getElementById('mClose').onclick=closeExport;
window.addEventListener('keydown',e=>{
  if(exportModal.style.display!=='flex')return;
  if(e.key==='Escape'){e.preventDefault();closeExport();}
  if(e.key==='Tab'){
    const controls=Array.from(exportModal.querySelectorAll('button')).filter(b=>!b.disabled),first=controls[0],last=controls[controls.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
document.getElementById('btnPublish').addEventListener('click',()=>document.getElementById('mClose').focus());
['btnShadow','btnMeasure','btnBlend'].forEach(id=>{const b=document.getElementById(id);b.addEventListener('click',()=>b.setAttribute('aria-pressed',String(b.classList.contains('toggled'))));});

/* ---------- 리사이즈 & 루프 ---------- */
function resize(){
  const w = vpEl.clientWidth, h = vpEl.clientHeight;
  if(w<2 || h<2){ setTimeout(resize, 200); return; } // 회전 직후 0-사이즈 방지
  renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); layoutViewportTools();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>{ setTimeout(resize,150); setTimeout(resize,500); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(resize,100); });
resize();
let frame = 0;
function updateLEDVideos(){
  objects.forEach(o=>{
    const s = o.ledSrc;
    if(o.type==='led' && s && s.type==='video' && s.ready && !s.el.paused){
      if(s.hasRVFC){ if(!s.frameReady) return; s.frameReady = false; }
      else if(s.live && frame % 2 !== 0) return;   // 폴백: 격프레임
      const t = o.mesh.material.map;
      if(t && t.userData && t.userData.redraw) t.userData.redraw();
    }
  });
}
function loop(){
  requestAnimationFrame(loop);
  stepCamAnim();
  pushUniforms();
  updateLEDVideos();
  updateGizmo();
  updateProjViz();
  updateMeasureLabel();updatePlacementMarker();
  if(frame++ % 12 === 0) updateHUD();
  renderer.render(scene, camera);
}

/* ---------- 시작 씬 ---------- */
updateStage();
const p1 = addProjector(PROJ_LIB[0]); p1.params.z = 12; p1.params.y = 1.8;
select(null);
initializeState();
loop();
} catch(error) {
  console.error(error);
  const vp=document.getElementById('vp'),box=document.createElement('div');box.className='boot-error';
  const title=document.createElement('b');title.textContent='3D 화면을 시작하지 못했어요.';
  const msg=document.createElement('p');msg.textContent=typeof THREE==='undefined'?'인터넷 연결을 확인한 뒤 다시 시도해 주세요.':'브라우저의 그래픽 가속을 켜거나 최신 Chrome / Edge에서 다시 열어 주세요.';
  const retry=document.createElement('button');retry.className='tbtn';retry.textContent='다시 시도';retry.onclick=()=>location.reload();
  box.append(title,msg,retry);vp.appendChild(box);
}

  const badge=document.createElement('small');badge.id='siteLocation';badge.textContent=label+(revision?' · '+revision:'');
  badge.title=local?'이 컴퓨터에서 여는 시뮬레이터입니다. GitHub 사이트와 자동 동기화되지 않습니다.':host==='dot0313-design.github.io'?'GitHub에 배포한 HTML입니다. 영상 입력은 같은 컴퓨터의 Projector Bridge에서 받습니다.':'현재 주소에서 불러온 시뮬레이터입니다.';
  document.querySelector('#logo .brandtext')?.appendChild(badge);
})();
